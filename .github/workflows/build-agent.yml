name: Build Windows agent (exe)

on:
  push:
    branches: [main, master]
    paths: ["agent/**", ".github/workflows/build-agent.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agent/requirements.txt pyinstaller

      - name: Build exe
        working-directory: agent
        run: >
          python -m PyInstaller --onefile --noconsole --name RemotePad-Agent
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          remotepad_agent.py

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemotePad-Agent
          path: agent/dist/RemotePad-Agent.exe

      - name: Attach exe to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: agent/dist/RemotePad-Agent.exe
