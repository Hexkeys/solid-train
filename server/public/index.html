<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<title>RemotePad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================ LOGIN ============================ -->
<section id="login" class="login">
  <form id="loginForm" class="card" autocomplete="off">
    <div class="mini-monitor" aria-hidden="true"><div class="mini-screen"></div></div>
    <h1>RemotePad</h1>
    <p class="sub">Control your computer from this page.</p>

    <label for="devId">Computer ID</label>
    <input id="devId" inputmode="numeric" placeholder="123 456 789" maxlength="11" required>

    <label for="devPw">Password</label>
    <input id="devPw" type="password" placeholder="shown in the RemotePad app on your PC" autocapitalize="off" autocorrect="off" spellcheck="false" required>

    <button id="connectBtn" type="submit">Connect</button>
    <p id="err" class="err" role="alert"></p>
  </form>
</section>

<!-- ============================ DESK ============================ -->
<section id="desk" class="desk" hidden>
  <header class="bar">
    <div class="who"><span class="dot"></span><span id="status">Connecting…</span></div>
    <div class="tools">
      <select id="quality" title="Picture quality">
        <option value="low">Low</option>
        <option value="med" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button id="btnFocus" type="button" title="Hide keyboard and mouse">Screen only</button>
      <button id="btnPhoneKb" type="button" title="Use this device's own keyboard">Aa</button>
      <button id="btnFull" type="button" title="Full screen">Full screen</button>
      <button id="btnQuit" type="button" class="danger">Disconnect</button>
    </div>
  </header>

  <main class="stage">
    <!-- the pink monitor -->
    <div class="monitor">
      <div class="bezel">
        <div id="screenbox" class="screenbox">
          <canvas id="screen" width="16" height="9"></canvas>
          <div id="cursor" class="cursor" aria-hidden="true">
            <svg viewBox="0 0 16 22" width="16" height="22"><path d="M1 1 L1 17 L5 13.5 L8 20 L10.6 18.8 L7.6 12.4 L13 12.4 Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </div>
          <div class="waiting">Waiting for the first picture…</div>
        </div>
      </div>
      <svg class="stand" viewBox="0 0 330 70" aria-hidden="true">
        <path d="M130 0 L134 22 L112 52 L218 52 L196 22 L200 0 Z" fill="#d27ba0" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/>
        <line x1="145" y1="26" x2="185" y2="26" stroke="#111" stroke-width="1.6"/>
        <rect x="6" y="52" width="318" height="14" rx="7" fill="#d27ba0" stroke="#111" stroke-width="1.6"/>
      </svg>
    </div>

    <!-- keyboard + mouse -->
    <div id="peripherals" class="peripherals">
      <div id="osk" class="osk" aria-label="On-screen keyboard"><div class="osk-top"></div><div id="oskRows" class="osk-rows"></div></div>

      <svg id="mouse" class="mouse" viewBox="0 0 200 250" aria-label="Mouse">
        <defs>
          <clipPath id="bodyClip"><ellipse cx="100" cy="128" rx="78" ry="108"/></clipPath>
        </defs>
        <g class="mouse-tilt" transform="rotate(-18 100 125)">
          <ellipse id="mBody" cx="100" cy="128" rx="78" ry="108" fill="#e6e6e6" stroke="#9a9a9a" stroke-width="1.5"/>
          <!-- dark swoosh -->
          <path d="M22 118 C26 170 60 230 118 232 C150 228 172 190 176 150 C160 190 120 214 86 196 C50 178 32 150 22 118 Z" fill="#333" pointer-events="none"/>
          <!-- buttons (clipped to the body) -->
          <g clip-path="url(#bodyClip)">
            <rect id="mBtnL" class="mbtn" x="0" y="0" width="100" height="108" fill="#000" fill-opacity="0"/>
            <rect id="mBtnR" class="mbtn" x="100" y="0" width="100" height="108" fill="#000" fill-opacity="0"/>
          </g>
          <path d="M100 20 L100 108 M26 108 L174 108" stroke="#a9a9a9" stroke-width="1.2" fill="none" pointer-events="none"/>
          <!-- wheel -->
          <ellipse id="mWheel" cx="100" cy="64" rx="17" ry="26" fill="#3a3a3a" stroke="#111" stroke-width="1"/>
          <ellipse cx="100" cy="64" rx="9" ry="15" fill="#a8a8a8" pointer-events="none"/>
        </g>
      </svg>
    </div>
  </main>

  <textarea id="kbInput" class="kb-input" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true" tabindex="-1"></textarea>
</section>

<script src="app.js"></script>
</body>
</html>
